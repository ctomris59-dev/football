name: thursday-market-validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-final-market-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile final Thursday modules
        run: |
          python -m py_compile export_app.py market_consensus_builder.py international_market_reference.py thursday_decision_engine.py thursday_decision_engine_v2.py thursday_decision_engine_v3.py thursday_opening_watch.py thursday_schedule_tick.py live_refresh.py turkey_value_workflow.py turkey_two_sided_odds.py weekly_trusted_predictions.py weekly_trusted_predictions_v2.py thursday_page.py test_ranked_list_policy.py
      - name: Validate no-vig, Turkey-value and weekly-reliability separation
        run: |
          python - <<'PY'
          from pathlib import Path
          from market_consensus_builder import no_vig, no_vig_pair
          from international_market_reference import reference_quality
          from thursday_decision_engine import market_metrics
          from thursday_decision_engine_v2 import playable_decision_ready
          from turkey_two_sided_odds import _side
          from weekly_trusted_predictions import _selected_market_probability, _public

          fair = no_vig(1.90, 2.00)
          assert fair is not None and 0 < fair < 1
          assert no_vig(29.0, 1.03) is None
          assert no_vig_pair(12.0, 1.04) is None

          ok, quality = reference_quality(2, .69, .02, None, None)
          assert ok and quality == 'multi_book_consensus'
          ok, _ = reference_quality(1, .69, .02, None, None)
          assert not ok
          ok, quality = reference_quality(1, .69, 0.0, 'pinnacle', .69)
          assert ok and quality == 'sharp_single_book'

          m = market_metrics(.72, 1.55, .69)
          assert abs(m['tr_implied_probability'] - 1/1.55) < 1e-12
          assert m['model_ev_vs_tr'] > .11
          assert abs(m['model_market_gap'] - .03) < 1e-12
          assert 'international_ev_vs_tr' not in m
          assert 'international_edge_vs_tr' not in m

          # Changing the foreign fair probability must never change Turkey-value math.
          m2 = market_metrics(.72, 1.55, .40)
          assert m2['model_ev_vs_tr'] == m['model_ev_vs_tr']
          assert m2['model_edge_vs_tr'] == m['model_edge_vs_tr']

          forbidden = (
              'international_edge_vs_tr', 'international_ev_vs_tr',
              'INTERNATIONAL_MIN_TR_EDGE', 'INTERNATIONAL_MIN_TR_EV',
          )
          for name in (
              'thursday_decision_engine.py', 'thursday_decision_engine_v2.py',
              'thursday_decision_engine_v3.py', 'weekly_trusted_predictions.py',
              'weekly_trusted_predictions_v2.py',
          ):
              src = Path(name).read_text(encoding='utf-8')
              for token in forbidden:
                  assert token not in src, (name, token)

          assert not playable_decision_ready(.89, 0, 0.0)
          assert playable_decision_ready(.95, 0, 0.0)
          assert not playable_decision_ready(.95, 1, 0.0)
          assert playable_decision_ready(.95, 1, .80)

          assert _side('over_2_5', 'Üst') == 'yes'
          assert _side('over_2_5', 'Alt') == 'no'
          assert _side('btts', 'Var') == 'yes'
          assert _side('btts', 'Yok') == 'no'
          assert abs(_selected_market_probability({'reference_p_yes': .62}, False) - .38) < 1e-12

          low = _public({
              'event_id':'x','match_date':None,'league':'L','home':'A','away':'B',
              'market':'over_2_5','selection':'2.5 ÜST','confidence':.66,
              'ranking_score':.64,'price':{'tr_price':1.70,'tr_opening_price':1.72,'tr_source':'iddaa_official'},
              'international':{},'international_selected_probability':None,
              'market_check':'reference_unavailable','early_context':{}
          })
          assert low['strict_high_confidence'] is False
          assert low['confidence_tier'] == 'Haftanın En Güvenilirleri'
          high_item = _public({
              'event_id':'y','match_date':None,'league':'L','home':'C','away':'D',
              'market':'btts','selection':'KG VAR','confidence':.71,
              'ranking_score':.69,'price':{'tr_price':1.55,'tr_opening_price':1.58,'tr_source':'iddaa_official'},
              'international':{},'international_selected_probability':None,
              'market_check':'reference_unavailable','early_context':{}
          })
          assert high_item['strict_high_confidence'] is True
          assert high_item['confidence_tier'] == 'Yüksek Güven'
          print('thursday-market-validation-ok')
          PY
      - name: Validate Core4/Strong/Other tiers and value-badge-only policy
        run: pytest -q test_ranked_list_policy.py
      - name: Validate Thursday scheduler window, weekly horizon and auth
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from fastapi import HTTPException
          from thursday_schedule_tick import in_decision_window
          from thursday_decision_engine import weekend_bounds
          import export_app

          tr = ZoneInfo('Europe/Istanbul')
          assert not in_decision_window(datetime(2026, 9, 10, 8, 59, tzinfo=tr))
          assert in_decision_window(datetime(2026, 9, 10, 9, 0, tzinfo=tr))
          assert in_decision_window(datetime(2026, 9, 10, 11, 51, tzinfo=tr))
          assert in_decision_window(datetime(2026, 9, 11, 12, 0, tzinfo=tr))
          assert not in_decision_window(datetime(2026, 9, 11, 12, 1, tzinfo=tr))

          week_key, start, end = weekend_bounds(datetime(2026, 9, 10, 11, 51, tzinfo=tr))
          assert week_key.isoformat() == '2026-09-11'
          assert start.astimezone(tr) == datetime(2026, 9, 11, 0, 0, tzinfo=tr)
          assert end.astimezone(tr) == datetime(2026, 9, 15, 0, 0, tzinfo=tr)

          export_app.THURSDAY_SCHEDULER_KEY = 'ci-secret'
          for bad in (None, '', 'wrong'):
              try:
                  export_app.scheduler_auth(bad)
                  raise AssertionError('scheduler auth should reject missing/wrong key')
              except HTTPException as exc:
                  assert exc.status_code == 401
          export_app.scheduler_auth('ci-secret')
          print('thursday-scheduler-window-horizon-auth-ok')
          PY
