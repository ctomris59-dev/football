name: thursday-market-validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-final-market-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile final Thursday modules
        run: |
          python -m py_compile export_app.py market_consensus_builder.py international_market_reference.py thursday_decision_engine.py thursday_decision_engine_v2.py thursday_opening_watch.py thursday_schedule_tick.py live_refresh.py turkey_value_workflow.py
      - name: Validate no-vig and Turkey-value separation
        run: |
          python - <<'PY'
          from market_consensus_builder import no_vig, no_vig_pair
          from international_market_reference import reference_quality
          from thursday_decision_engine import market_metrics
          from thursday_decision_engine_v2 import playable_decision_ready

          fair = no_vig(1.90, 2.00)
          assert fair is not None and 0 < fair < 1

          # Old malformed central-market price patterns must fail closed.
          assert no_vig(29.0, 1.03) is None
          assert no_vig_pair(12.0, 1.04) is None

          ok, quality = reference_quality(2, .69, .02, None, None)
          assert ok and quality == 'multi_book_consensus'
          ok, _ = reference_quality(1, .69, .02, None, None)
          assert not ok
          ok, quality = reference_quality(1, .69, 0.0, 'pinnacle', .69)
          assert ok and quality == 'sharp_single_book'

          m = market_metrics(.72, 1.55, .69)
          assert abs(m['tr_implied_probability'] - 1/1.55) < 1e-12
          assert m['model_ev_vs_tr'] > .11
          assert m['international_ev_vs_tr'] > .06
          assert m['model_edge_vs_tr'] > 0
          assert m['international_edge_vs_tr'] > 0

          # A market not offered by Turkey is non-executable, not missing coverage.
          assert not playable_decision_ready(.89, 0, 0.0)
          assert playable_decision_ready(.95, 0, 0.0)
          assert not playable_decision_ready(.95, 1, 0.0)
          assert playable_decision_ready(.95, 1, .80)
          print('thursday-market-validation-ok')
          PY
      - name: Validate Thursday scheduler window, weekly horizon and auth
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from fastapi import HTTPException
          from thursday_schedule_tick import in_decision_window
          from thursday_decision_engine import weekend_bounds
          import export_app

          tr = ZoneInfo('Europe/Istanbul')
          assert not in_decision_window(datetime(2026, 9, 10, 8, 59, tzinfo=tr))
          assert in_decision_window(datetime(2026, 9, 10, 9, 0, tzinfo=tr))
          assert in_decision_window(datetime(2026, 9, 10, 11, 51, tzinfo=tr))
          assert in_decision_window(datetime(2026, 9, 11, 12, 0, tzinfo=tr))
          assert not in_decision_window(datetime(2026, 9, 11, 12, 1, tzinfo=tr))

          week_key, start, end = weekend_bounds(datetime(2026, 9, 10, 11, 51, tzinfo=tr))
          assert week_key.isoformat() == '2026-09-11'
          assert start.astimezone(tr) == datetime(2026, 9, 11, 0, 0, tzinfo=tr)
          assert end.astimezone(tr) == datetime(2026, 9, 15, 0, 0, tzinfo=tr)

          export_app.THURSDAY_SCHEDULER_KEY = 'ci-secret'
          for bad in (None, '', 'wrong'):
              try:
                  export_app.scheduler_auth(bad)
                  raise AssertionError('scheduler auth should reject missing/wrong key')
              except HTTPException as exc:
                  assert exc.status_code == 401
          export_app.scheduler_auth('ci-secret')
          print('thursday-scheduler-window-horizon-auth-ok')
          PY
