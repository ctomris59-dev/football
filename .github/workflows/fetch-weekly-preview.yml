name: fetch-weekly-preview
on:
  push:
    branches: [ops/fetch-weekly-preview]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch full live weekly candidates
        run: |
          set -euo pipefail
          echo '=== FULL WEEKLY CANDIDATES ==='
          curl --fail --silent --show-error --max-time 120 https://football-dataset-export.onrender.com/weekly-candidates | python -m json.tool
