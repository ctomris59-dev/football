name: Sync Football-Data cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    paths:
      - ".github/workflows/sync-football-data.yml"
      - ".trigger-football-data-sync"

permissions:
  contents: write

concurrency:
  group: football-data-cache-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Big Five season data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/football-data
          leagues=(E0 SP1 I1 D1 F1)
          seasons=(2425 2526 2627)

          fetch() {
            local url="$1"
            local out="$2"
            echo "Fetching $url"
            curl -fL \
              --retry 8 \
              --retry-delay 5 \
              --retry-max-time 240 \
              --connect-timeout 20 \
              --max-time 120 \
              -A "Mozilla/5.0 (compatible; football-dataset-cache/1.0)" \
              "$url" -o "$out"
          }

          for season in "${seasons[@]}"; do
            tmpzip="/tmp/football-data-${season}.zip"
            if fetch "https://www.football-data.co.uk/mmz4281/${season}/data.zip" "$tmpzip"; then
              mkdir -p "data/football-data/${season}"
              for league in "${leagues[@]}"; do
                if unzip -p "$tmpzip" "${league}.csv" > "data/football-data/${season}/${league}.csv" 2>/dev/null && [ -s "data/football-data/${season}/${league}.csv" ]; then
                  echo "Stored ${season}/${league}.csv"
                else
                  rm -f "data/football-data/${season}/${league}.csv"
                  echo "ZIP missing ${league}.csv; falling back to direct CSV"
                  fetch "https://www.football-data.co.uk/mmz4281/${season}/${league}.csv" "data/football-data/${season}/${league}.csv"
                fi
              done
            else
              echo "Season ZIP failed; falling back to individual CSV files"
              mkdir -p "data/football-data/${season}"
              for league in "${leagues[@]}"; do
                fetch "https://www.football-data.co.uk/mmz4281/${season}/${league}.csv" "data/football-data/${season}/${league}.csv"
              done
            fi
          done

      - name: Download upcoming fixtures
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            --retry 8 \
            --retry-delay 5 \
            --retry-max-time 240 \
            --connect-timeout 20 \
            --max-time 120 \
            -A "Mozilla/5.0 (compatible; football-dataset-cache/1.0)" \
            "https://www.football-data.co.uk/fixtures.csv" \
            -o data/football-data/fixtures.csv || true

      - name: Validate cached CSVs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv
          import io

          expected = []
          for season in ("2425", "2526", "2627"):
              for league in ("E0", "SP1", "I1", "D1", "F1"):
                  expected.append(Path("data/football-data") / season / f"{league}.csv")

          found = 0
          for path in expected:
              if not path.exists() or path.stat().st_size < 100:
                  print(f"WARN missing/short: {path}")
                  continue
              raw = path.read_bytes()
              text = None
              for enc in ("utf-8-sig", "cp1252", "latin-1"):
                  try:
                      text = raw.decode(enc)
                      break
                  except UnicodeDecodeError:
                      pass
              reader = csv.DictReader(io.StringIO(text or ""))
              fields = set(reader.fieldnames or [])
              required = {"Date", "HomeTeam", "AwayTeam", "FTHG", "FTAG"}
              if not required.issubset(fields):
                  raise SystemExit(f"Invalid CSV schema for {path}: {reader.fieldnames}")
              rows = sum(1 for _ in reader)
              if rows == 0:
                  raise SystemExit(f"No rows in {path}")
              print(f"OK {path}: {rows} rows")
              found += 1

          if found < 10:
              raise SystemExit(f"Too few valid Big Five files: {found}/15")
          print(f"Validated {found}/15 season/league files")
          PY

      - name: Commit refreshed cache
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/football-data
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Refresh Football-Data cache"
          git push
